[package]
name = "tatu-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Tatu Win32 backend. Single binary with two modes: --launch (bootstrap — CreateProcess self with --connect + CreateProcess game.exe inside one Proton invocation, so both children share the SLR container + wineserver) and --connect (the cheat worker — OpenProcess + VirtualAllocEx + memory ops against the game)."

[[bin]]
name = "tatu-bridge"
path = "src/main.rs"

# Cross-platform deps: pure-Rust helpers (AOB parser/scanner) compile
# on Linux too so their unit tests run as part of the workspace test.
[dependencies]
memchr = "2"
thiserror = "1"

# Windows-only deps under a target cfg so workspace `cargo build` from
# a Linux host skips them silently.
[target.'cfg(target_os = "windows")'.dependencies]
tatu-proto = { path = "../tatu-proto" }
# AF_UNIX in std::os::windows::net is still nightly-only as of Rust
# 1.93; uds_windows wraps Winsock2 AF_UNIX (Windows 10+ / Wine 7+).
uds_windows = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
