[package]
name = "cheat-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Linux-native Cheat Engine Auto-Assembler runtime. Reusable from any Rust binary or FFI wrapper (Decky Loader plugin, CLI, etc.)."

[lib]
# rlib for normal Rust dependents (the tracker, a sibling Decky wrapper crate).
# cdylib enables `cargo build --release` to emit `libcheat_runtime.so` so a
# Python/C FFI layer (Decky's Python backend) can dlopen it directly.
crate-type = ["rlib", "cdylib"]

[dependencies]
dirs = "6"
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "encoder", "code_asm"] }
memchr = "2"
nix = { version = "0.30", features = ["uio", "process", "ptrace", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
