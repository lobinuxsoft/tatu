[package]
name = "cheat-runtime-dll"
version = "0.1.0"
edition = "2024"
publish = false
description = "In-process Windows DLL backend for cheat-runtime. Loaded into a Wine/Proton game via dinput8.dll proxy so every memory write happens locally — no cross-process syscalls (#102)."

[lib]
# `cdylib` only — this crate produces `cheat_runtime_dll.dll` for the
# `x86_64-pc-windows-gnu` target and is never linked into the Linux
# tracker as a Rust dependency. Use `cheat-runtime-proto` for shared types.
crate-type = ["cdylib"]

# Windows-only deps live under a target cfg so `cargo check` from a Linux
# host (e.g. workspace-wide `cargo build`) silently skips them rather than
# pulling Win32 sysroot headers it doesn't have.
[target.'cfg(target_os = "windows")'.dependencies]
cheat-runtime-proto = { path = "../cheat-runtime-proto" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Environment",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
