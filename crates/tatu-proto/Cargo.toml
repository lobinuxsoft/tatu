[package]
name = "tatu-proto"
version = "0.1.0"
edition = "2024"
publish = false
description = "Wire types shared by tatu-tracker (Linux Tauri client) and tatu-bridge (Win32 backend running under Wine). Encoded with bincode 2 + serde."

[dependencies]
bincode = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
