[package]
name = "tatu-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
dirs = "6"
tauri-plugin-opener = "2"
regex = "1"
steam-vdf-parser = "0.1.1"
cheat-runtime = { path = "../crates/cheat-runtime" }
ce-launcher = { path = "../crates/ce-launcher" }
thiserror = "2"
urlencoding = "2"
# REFramework installer (#98) extracts dinput8.dll from praydog's release
# zip. ce-launcher already pulls the same crate at the same major version
# — keep them aligned to avoid two copies in the dep tree.
zip = "8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
