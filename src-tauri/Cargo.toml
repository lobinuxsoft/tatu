[package]
name = "game-progress-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
dirs = "6"
tauri-plugin-opener = "2"
regex = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
