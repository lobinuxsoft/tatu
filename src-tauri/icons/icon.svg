    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#388bfd"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Gamepad body -->
  <path d="M156 200 C156 180, 176 160, 196 160 L316 160 C336 160, 356 180, 356 200 L356 260 C356 280, 380 340, 380 360 C380 390, 360 400, 340 400 C320 400, 310 390, 290 360 L280 340 L232 340 L222 360 C202 390, 192 400, 172 400 C152 400, 132 390, 132 360 C132 340, 156 280, 156 260 Z" fill="#21262d" stroke="#30363d" stroke-width="4"/>
