name: CI

on:
  pull_request:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check --all

      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --workspace

  rust-build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            binary: tatu-tracker
        # windows-amd64 disabled while the tool stays Linux-only.
        # Re-add `- target: windows-amd64 / os: windows-latest /
        # binary: tatu-tracker.exe` if/when tracker ships to Windows.
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: src-tauri/target/release/${{ matrix.binary }}
          retention-days: 7

  tatu-bridge-build:
    name: Build tatu-bridge (Win64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: tatu-bridge

      - name: Install mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cross-compile tatu-bridge
        run: ./scripts/build-tatu-bridge.sh

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: tatu-bridge
          path: target/dist/tatu-bridge.exe
          retention-days: 7

  tatu-launcher-build:
    name: Build tatu-launcher (Linux)
    runs-on: ubuntu-latest
    needs: tatu-bridge-build
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: tatu-launcher

      - name: Download tatu-bridge.exe
        uses: actions/download-artifact@v4
        with:
          name: tatu-bridge
          path: target/dist

      - name: Build + stage tatu-launcher drop-in
        run: ./scripts/build-tatu-launcher.sh

      - name: Upload compat-tool drop-in
        uses: actions/upload-artifact@v4
        with:
          name: tatu-launcher
          path: target/dist/tatu-launcher
          retention-days: 7
