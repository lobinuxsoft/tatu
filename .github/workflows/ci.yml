name: CI

on:
  pull_request:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Tauri's build.rs hard-fails `cargo build`/`check`/`clippy`/`test` if a
      # declared bundle resource is missing on disk — not just at actual
      # bundling time. The launcher binaries (#204) are never committed (the
      # stock Godot export template alone exceeds GitHub's 100MiB commit
      # limit) and only get built for real by a release job (follow-up,
      # tracked separately) — these empty stand-ins are enough to satisfy
      # that check everywhere else.
      - name: Create placeholder launcher resources
        shell: bash
        run: |
          mkdir -p src-tauri/vendor/launcher/linux src-tauri/vendor/launcher/windows
          : > src-tauri/vendor/launcher/linux/tatu-launcher
          : > src-tauri/vendor/launcher/windows/tatu-launcher.exe

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check --all

      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Tauri's build.rs hard-fails `cargo build`/`check`/`clippy`/`test` if a
      # declared bundle resource is missing on disk — not just at actual
      # bundling time. The launcher binaries (#204) are never committed (the
      # stock Godot export template alone exceeds GitHub's 100MiB commit
      # limit) and only get built for real by a release job (follow-up,
      # tracked separately) — these empty stand-ins are enough to satisfy
      # that check everywhere else.
      - name: Create placeholder launcher resources
        shell: bash
        run: |
          mkdir -p src-tauri/vendor/launcher/linux src-tauri/vendor/launcher/windows
          : > src-tauri/vendor/launcher/linux/tatu-launcher
          : > src-tauri/vendor/launcher/windows/tatu-launcher.exe

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --workspace

  rust-build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            binary: tatu-tracker
          # The Windows build is the tracker only: the cheat runtime sits
          # behind cfg(unix) until tatu-win lands (#181).
          - target: windows-amd64
            os: windows-latest
            binary: tatu-tracker.exe
    steps:
      - uses: actions/checkout@v6

      # Tauri's build.rs hard-fails `cargo build`/`check`/`clippy`/`test` if a
      # declared bundle resource is missing on disk — not just at actual
      # bundling time. The launcher binaries (#204) are never committed (the
      # stock Godot export template alone exceeds GitHub's 100MiB commit
      # limit) and only get built for real by a release job (follow-up,
      # tracked separately) — these empty stand-ins are enough to satisfy
      # that check everywhere else.
      - name: Create placeholder launcher resources
        shell: bash
        run: |
          mkdir -p src-tauri/vendor/launcher/linux src-tauri/vendor/launcher/windows
          : > src-tauri/vendor/launcher/linux/tatu-launcher
          : > src-tauri/vendor/launcher/windows/tatu-launcher.exe

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      # The repo is a Cargo workspace: target/ lives at the root, not in src-tauri/.
      - name: Build binary
        run: cargo build --release -p tatu-tracker

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: target/release/${{ matrix.binary }}
          # Fail loudly instead of uploading an empty artifact.
          if-no-files-found: error
          retention-days: 7

